<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title id="titulosucesso">Sucesso</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>

        #titulosucesso {
            color: #fff8f8;
        }
        .caixa-sucesso {
            max-width: 400px;
            margin: 100px auto;
            background-color: #004B87;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            color: #f8f7f7;
        }
        .icone-sucesso { font-size: 50px; color: #128b45; margin-bottom: 15px; }
        .caixa-sucesso h2 { margin-bottom: 20px; color: #e3eaf0; }
        .btn-voltar {
            display: inline-block; background-color: #2182c2; color: white; border: none; 
            padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; 
            text-decoration: none; margin-top: 10px; transition: background 0.2s;
        }
        .btn-voltar:hover { background-color: #005999; }
    </style>
</head>
<body class="paginabanco">
    <div class="caixa-sucesso">
        <div class="icone-sucesso">✓</div>
        <h2>Item Cadastrado com Sucesso!</h2>
        <p>O produto já foi salvo no banco de dados e está visível no estoque.</p>
       
        <a href="/banco" class="btn-voltar">Voltar para a Tabela</a>
    </div>
</body>

 <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-body-tertiary">

        <div class="container-fluid">

            <img src="{{ url_for('static', filename='imagens/senailogo.png') }}"
                 id="imgnavbar">


            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                    <!-- LOGIN -->

                    <li class="nav-item">

                        <a class="nav-link active"
                           aria-current="page"
                           href="/index">

                            Login

                        </a>

                    </li>

                     <!--BANCO-->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/banco"
                           style="color: rgb(41, 38, 38);">

                            Estoque 

                        </a>

                    </li>


                    <!-- CADASTRAR ITEM -->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/adicionaritens"
                           style="color: rgb(41, 38, 38);">

                            Cadastrar um item

                        </a>

                    </li>


                    <!-- MOVIMENTAÇÃO -->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/movimentacao"
                           style="color: rgb(41, 38, 38);">

                            Movimentação

                        </a>

                    </li>


                    <!-- SOMENTE ADMINISTRADOR -->

                    {% if session.get('usuario_role') == 'admin' %}

                        <li class="nav-item">

                            <a class="nav-link"
                               href="cadastrar_usuarios"
                               style="color: rgb(41, 38, 38);">

                                Cadastrar Usuários

                            </a>

                        </li>

                    {% endif %}


                    </li>


                </ul>

            </div>

        </div>

    </nav>


    <!-- NAVBAR AZUL -->

    <nav id="navbar" data-bs-theme="dark">
    </nav>

</html>
