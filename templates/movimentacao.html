<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação de Estoque</title>
    
    <!-- Bootstrap 5 para ajudar no alinhamento e formulários -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Link para o seu CSS externo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <style>
        :root {
            --azul-fundo: #1867a8; /* Azul escuro do fundo */
            --azul-botao: #1867a8; /* Azul do botão principal */
            --laranja-botao: #d97736; /* Laranja do botão cancelar/voltar */
            --cor-titulo: #c46c3b; /* Cor do título similar à tela de cadastro */
        }

        body {
            background-color: var(--azul-fundo);
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* Organiza os elementos em linha vertical */
            align-items: center;    /* Centraliza horizontalmente o cartão */
            justify-content: center; /* Centraliza verticalmente o cartão */
            margin: 0;
            padding-top: 70px;      /* Espaço para o conteúdo não sumir atrás da navbar */
            font-family: Arial, sans-serif;
        }

        /* FIXAR A NAVBAR NO TOPO */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1050; /* Mantém a barra na frente de tudo */
        }

        /* Estilo do cartão branco centralizado */
        .cartao-formulario {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.3);
            margin: auto 0; /* Ajuda a centralizar o card perfeitamente no espaço restante */
        }

        /* Título do formulário */
        .cartao-formulario h2 {
            text-align: center;
            color: var(--cor-titulo);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* Estilo das labels */
        .cartao-formulario label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 5px;
        }

        /* Estilo dos inputs e selects */
        .cartao-formulario .form-control, 
        .cartao-formulario .form-select {
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 6px;
        }

        /* Estilo dos botões */
        .btn-principal {
            background-color: var(--azul-botao);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        
        .btn-principal:hover {
            background-color: #082d6b;
            color: white;
        }

        .btn-secundario {
            background-color: var(--laranja-botao);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-secundario:hover {
            background-color: #b55e26;
            color: white;
        }
    </style>

</head>
<body { 
padding-top: 60px}>

     <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-body-tertiary">

        <div class="container-fluid">

            <img src="{{ url_for('static', filename='imagens/senailogo.png') }}"
                 id="imgnavbar">


            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">


                    <!-- LOGIN -->

                    <li class="nav-item">

                        <a class="nav-link active"
                           aria-current="page"
                           href="/index">

                            Login

                        </a>

                    </li>

                     <!--BANCO-->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/banco"
                           style="color: rgb(41, 38, 38);">

                            Estoque 

                        </a>

                    </li>


                    <!-- CADASTRAR ITEM -->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/adicionaritens"
                           style="color: rgb(41, 38, 38);">

                            Cadastrar um item

                        </a>

                    </li>


                    <!-- MOVIMENTAÇÃO -->

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/movimentacao"
                           style="color: rgb(41, 38, 38);">

                            Movimentação

                        </a>

                    </li>


                    <!-- SOMENTE ADMINISTRADOR -->

                    {% if session.get('usuario_role') == 'admin' %}

                        <li class="nav-item">

                            <a class="nav-link"
                               href="cadastrar_usuarios"
                               style="color: rgb(41, 38, 38);">

                                Cadastrar Usuários

                            </a>

                        </li>

                    {% endif %}


                    </li>


                </ul>

            </div>

        </div>

    </nav>


    <!-- NAVBAR AZUL -->

    <nav id="navbar" data-bs-theme="dark">
    </nav>


    <div class="cartao-formulario">
        <h2>Atualizar Quantidade</h2>

        <form action="/salvar" method="POST">
            
            <!-- Selecionar Item -->
            <div class="mb-3">
                <label for="selecionaitem">Item:</label>
                <select id="selecionaitem" class="form-select" name="id_item" required>
                    <option value="" disabled selected>Selecione o item...</option>
                    {% for item in itens %}
                        <option value="{{ item[0] }}">{{ item[1] }} (Atual: {{ item[2] }})</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Tipo de Operação -->
            <div class="mb-3">
                <label for="tipo_operacao">Tipo de Movimentação:</label>
                <select id="tipo_operacao" class="form-select" name="tipo" required>
                    <option value="entrada">Entrada (+)</option>
                    <option value="saida">Saída (-)</option>
                </select>
            </div>

            <!-- Campo: Quantidade -->
            <div class="mb-4">
                <label for="qtd_atualizar">Quantidade:</label>
                <input type="number" id="qtd_atualizar" class="form-control" name="quantidade" min="1" placeholder="Digite a quantidade..." required>
            </div>

            <!-- Botões lado a lado (Copiando o padrão da tela de cadastro) -->
            <div class="row gx-2 mt-4">
                <div class="col-6 d-grid">
                    <button type="submit" class="btn-principal">Salvar item</button>
                </div>
                <div class="col-6 d-grid">
                    <a href="{{ url_for('banco') }}" class="btn-secundario">Cancelar</a>
                </div>
            </div>

        </form>
    </div>

    <!-- Script do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
